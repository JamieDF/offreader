<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OffReader — Featured Graphic v2 (Warm Gradient)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 40px; background: #dcd6c9; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .canvas {
    width: 1024px; height: 500px; flex-shrink: 0; position: relative; overflow: hidden;
    background: linear-gradient(145deg, #f5f0e6 0%, #e8dcc4 55%, #ddc9a3 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .glow {
    position: absolute; width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,250,238,0.85) 0%, rgba(255,250,238,0) 68%);
    top: -60px; left: 50%; transform: translateX(-50%); pointer-events: none;
  }
  .logo-wrap { position: relative; z-index: 1; }
  .logo { width: 150px; height: 150px; display: block; }
  .wordmark { font-size: 70px; font-weight: 800; letter-spacing: -0.025em; color: #33291f; margin-top: 24px; position: relative; z-index: 1; }
  .tagline { font-size: 26px; font-weight: 500; color: #7a4d1f; margin-top: 10px; letter-spacing: 0.02em; position: relative; z-index: 1; }
  .hint { font-family: 'Inter', sans-serif; font-size: 13px; color: #6b6258; }
  code { background:#efeae0; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="logo-wrap"><img class="logo" src="../offReader.svg" alt="OffReader"></div>
    <div class="wordmark">OffReader</div>
    <div class="tagline">Offline ebook library &amp; reader</div>
  </div>
  <p class="hint">Screenshot the <strong>1024 × 500</strong> card above (DevTools → inspect the <code>.canvas</code> node → <code>Capture node screenshot</code>).</p>
</body>
</html>
